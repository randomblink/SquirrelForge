name: Flock deployment gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  deployment-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build runtime and mock-provider images
        run: |
          docker build --file deploy/Dockerfile --tag squirrelforge-ci .
          docker build --file deploy/mock-provider/Dockerfile --tag squirrelforge-mock-provider .

      - name: Generate ephemeral mock-provider TLS certificate
        run: |
          mkdir -p .ci-certs .ci-runtime
          chmod 0777 .ci-runtime
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .ci-certs/provider.key \
            -out .ci-certs/provider.crt \
            -days 1 \
            -subj "/CN=mock-provider" \
            -addext "subjectAltName=DNS:mock-provider"
          chmod 0444 .ci-certs/provider.crt .ci-certs/provider.key

      - name: Provision, start, and smoke-test production topology
        env:
          SMOKE_API_KEY: ci_smoke_api_key_0123456789abcdef0123456789abcdef
          PROVIDER_TOKEN: ci_provider_token_0123456789abcdef0123456789abcdef
        run: |
          set -eu
          cleanup() {
            docker logs squirrelforge-ci-runtime 2>/dev/null || true
            docker logs squirrelforge-ci-provider 2>/dev/null || true
            docker rm -f squirrelforge-ci-runtime squirrelforge-ci-provider 2>/dev/null || true
            docker network rm squirrelforge-ci-network 2>/dev/null || true
          }
          trap cleanup EXIT

          docker network create squirrelforge-ci-network

          docker run --rm \
            --entrypoint php \
            --volume "$PWD/.ci-runtime:/app/var" \
            --env SQUIRRELFORGE_ALLOW_SMOKE_PROVISIONING=1 \
            --env SQUIRRELFORGE_ENGINE_DB=/app/var/engine.sqlite \
            --env SQUIRRELFORGE_SMOKE_IDENTITY_REF=identity_ci_smoke \
            --env SQUIRRELFORGE_SMOKE_PERMISSION_REF=permission_ci_smoke \
            squirrelforge-ci \
            /app/bin/provision-smoke-identity.php

          docker run --detach \
            --name squirrelforge-ci-provider \
            --network squirrelforge-ci-network \
            --network-alias mock-provider \
            --volume "$PWD/.ci-certs:/certs:ro" \
            --env MOCK_TLS_CERT=/certs/provider.crt \
            --env MOCK_TLS_KEY=/certs/provider.key \
            --env MOCK_IDENTITY_REF=identity_ci_smoke \
            --env MOCK_API_KEY="$SMOKE_API_KEY" \
            --env MOCK_PROVIDER_TOKEN="$PROVIDER_TOKEN" \
            squirrelforge-mock-provider

          for attempt in $(seq 1 30); do
            if docker run --rm \
              --network squirrelforge-ci-network \
              --volume "$PWD/.ci-certs/provider.crt:/certs/provider.crt:ro" \
              curlimages/curl:8.10.1 \
              --fail --silent --show-error \
              --cacert /certs/provider.crt \
              --header "Authorization: Bearer $PROVIDER_TOKEN" \
              https://mock-provider:8090/v1/provider/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Mock credential provider did not become ready." >&2
              exit 1
            fi
            sleep 1
          done

          docker run --detach \
            --name squirrelforge-ci-runtime \
            --network squirrelforge-ci-network \
            --volume "$PWD/.ci-runtime:/app/var" \
            --volume "$PWD/.ci-certs/provider.crt:/certs/provider.crt:ro" \
            --env SSL_CERT_FILE=/certs/provider.crt \
            --env SQUIRRELFORGE_ENVIRONMENT=production \
            --env SQUIRRELFORGE_ENGINE_DB=/app/var/engine.sqlite \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER=http-json \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_URL=https://mock-provider:8090 \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_TOKEN="$PROVIDER_TOKEN" \
            squirrelforge-ci

          for attempt in $(seq 1 30); do
            if docker run --rm \
              --network squirrelforge-ci-network \
              curlimages/curl:8.10.1 \
              --fail --silent --show-error \
              http://squirrelforge-ci-runtime:8080/v1/health/providers >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "SquirrelForge did not become ready." >&2
              exit 1
            fi
            sleep 1
          done

          docker run --rm \
            --entrypoint php \
            --network squirrelforge-ci-network \
            --env SQUIRRELFORGE_SMOKE_BASE_URL=http://squirrelforge-ci-runtime:8080 \
            --env SQUIRRELFORGE_SMOKE_IDENTITY_REF=identity_ci_smoke \
            --env SQUIRRELFORGE_SMOKE_PERMISSION_REF=permission_ci_smoke \
            --env SQUIRRELFORGE_SMOKE_API_KEY="$SMOKE_API_KEY" \
            squirrelforge-ci \
            /app/bin/production-smoke-test.php

      - name: Generate CycloneDX SBOM from verified image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: squirrelforge-ci
          format: cyclonedx
          output: squirrelforge.cdx.json

      - name: Block critical or high image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: squirrelforge-ci
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Preserve exact verified image and evidence
        run: |
          docker save squirrelforge-ci | gzip -n > squirrelforge-image.tar.gz
          docker image inspect --format='{{.Id}}' squirrelforge-ci > squirrelforge-image.id
          sha256sum squirrelforge-image.tar.gz > squirrelforge-image.tar.gz.sha256
          sha256sum squirrelforge.cdx.json > squirrelforge.cdx.json.sha256

      - name: Upload verified image evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: squirrelforge-verified-image-${{ github.sha }}
          path: |
            squirrelforge-image.tar.gz
            squirrelforge-image.tar.gz.sha256
            squirrelforge-image.id
            squirrelforge.cdx.json
            squirrelforge.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deployment-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Download the exact verified image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: squirrelforge-verified-image-${{ github.sha }}

      - name: Verify evidence checksums and load image
        run: |
          sha256sum --check squirrelforge-image.tar.gz.sha256
          sha256sum --check squirrelforge.cdx.json.sha256
          gzip --decompress --stdout squirrelforge-image.tar.gz | docker load
          test "$(docker image inspect --format='{{.Id}}' squirrelforge-ci)" = "$(cat squirrelforge-image.id)"

      - name: Authenticate to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push verified image and capture immutable digest
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image_ref="ghcr.io/${REPOSITORY,,}"
          docker tag squirrelforge-ci "$image_ref:$RELEASE_TAG"
          docker push "$image_ref:$RELEASE_TAG"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image_ref:$RELEASE_TAG" | cut -d@ -f2)"
          test -n "$digest"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest with GitHub OIDC
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF@$DIGEST"

      - name: Attach build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image_ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attach CycloneDX SBOM attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image_ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: squirrelforge.cdx.json
          push-to-registry: true

  protected-rollout:
    needs: publish
    runs-on: [self-hosted, linux, squirrelforge-production]
    timeout-minutes: 45
    environment: production
    concurrency:
      group: squirrelforge-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure protected Kubernetes credentials
        env:
          KUBECONFIG_BASE64: ${{ secrets.SQUIRRELFORGE_KUBECONFIG_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/squirrelforge-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/squirrelforge-kubeconfig" >> "$GITHUB_ENV"

      - name: Record candidate admission
        env:
          GH_TOKEN: ${{ github.token }}
          SQUIRRELFORGE_ADMISSION_IMAGE: ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.digest }}
          SQUIRRELFORGE_ADMISSION_REPOSITORY: ${{ needs.publish.outputs.image_ref }}
          SQUIRRELFORGE_ADMISSION_SOURCE_REPOSITORY: ${{ github.repository }}
          SQUIRRELFORGE_ADMISSION_CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/.github/workflows/flock-deployment-gate.yml@refs/tags/v[0-9].*$
          SQUIRRELFORGE_ADMISSION_RECEIPT_PATH: admission-receipt.json
        run: bin/verify-release-image.sh

      - name: Admit and promote release digest
        id: rollout
        env:
          GH_TOKEN: ${{ github.token }}
          SQUIRRELFORGE_ADMISSION_IMAGE: ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.digest }}
          SQUIRRELFORGE_ADMISSION_REPOSITORY: ${{ needs.publish.outputs.image_ref }}
          SQUIRRELFORGE_ADMISSION_SOURCE_REPOSITORY: ${{ github.repository }}
          SQUIRRELFORGE_ADMISSION_CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/.github/workflows/flock-deployment-gate.yml@refs/tags/v[0-9].*$
          SQUIRRELFORGE_ROLLOUT_IMAGE: ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.digest }}
          SQUIRRELFORGE_ROLLOUT_NAMESPACE: ${{ vars.SQUIRRELFORGE_ROLLOUT_NAMESPACE }}
          SQUIRRELFORGE_ROLLOUT_STABLE_DEPLOYMENT: ${{ vars.SQUIRRELFORGE_ROLLOUT_STABLE_DEPLOYMENT }}
          SQUIRRELFORGE_ROLLOUT_CANARY_DEPLOYMENT: ${{ vars.SQUIRRELFORGE_ROLLOUT_CANARY_DEPLOYMENT }}
          SQUIRRELFORGE_ROLLOUT_CONTAINER: ${{ vars.SQUIRRELFORGE_ROLLOUT_CONTAINER }}
          SQUIRRELFORGE_ROLLOUT_CANARY_READINESS_URL: ${{ secrets.SQUIRRELFORGE_ROLLOUT_CANARY_READINESS_URL }}
          SQUIRRELFORGE_ROLLOUT_STABLE_READINESS_URL: ${{ secrets.SQUIRRELFORGE_ROLLOUT_STABLE_READINESS_URL }}
          SQUIRRELFORGE_ROLLOUT_CANARY_ERROR_RATE_URL: ${{ secrets.SQUIRRELFORGE_ROLLOUT_CANARY_ERROR_RATE_URL }}
          SQUIRRELFORGE_ROLLOUT_STABLE_ERROR_RATE_URL: ${{ secrets.SQUIRRELFORGE_ROLLOUT_STABLE_ERROR_RATE_URL }}
          SQUIRRELFORGE_ROLLOUT_MAXIMUM_ERROR_RATE_PERCENT: ${{ vars.SQUIRRELFORGE_ROLLOUT_MAXIMUM_ERROR_RATE_PERCENT }}
          SQUIRRELFORGE_ROLLOUT_RECEIPT_PATH: rollout-receipt.json
        run: |
          bin/rollout-release.sh
          rollback_image="$(php -r '$r=json_decode(file_get_contents("rollout-receipt.json"), true, 512, JSON_THROW_ON_ERROR); echo $r["rollback_image"];')"
          echo "rollback_image=$rollback_image" >> "$GITHUB_OUTPUT"

      - name: Observe promoted release
        id: observation
        continue-on-error: true
        env:
          SQUIRRELFORGE_OBSERVE_IMAGE: ${{ needs.publish.outputs.image_ref }}@${{ needs.publish.outputs.digest }}
          SQUIRRELFORGE_ROLLOUT_NAMESPACE: ${{ vars.SQUIRRELFORGE_ROLLOUT_NAMESPACE }}
          SQUIRRELFORGE_ROLLOUT_STABLE_DEPLOYMENT: ${{ vars.SQUIRRELFORGE_ROLLOUT_STABLE_DEPLOYMENT }}
          SQUIRRELFORGE_ROLLOUT_CONTAINER: ${{ vars.SQUIRRELFORGE_ROLLOUT_CONTAINER }}
          SQUIRRELFORGE_ROLLOUT_STABLE_READINESS_URL: ${{ secrets.SQUIRRELFORGE_ROLLOUT_STABLE_READINESS_URL }}
          SQUIRRELFORGE_ROLLOUT_STABLE_ERROR_RATE_URL: ${{ secrets.SQUIRRELFORGE_ROLLOUT_STABLE_ERROR_RATE_URL }}
          SQUIRRELFORGE_ROLLOUT_MAXIMUM_ERROR_RATE_PERCENT: ${{ vars.SQUIRRELFORGE_ROLLOUT_MAXIMUM_ERROR_RATE_PERCENT }}
          SQUIRRELFORGE_OBSERVE_SAMPLE_COUNT: ${{ vars.SQUIRRELFORGE_OBSERVE_SAMPLE_COUNT }}
          SQUIRRELFORGE_OBSERVE_INTERVAL_SECONDS: ${{ vars.SQUIRRELFORGE_OBSERVE_INTERVAL_SECONDS }}
          SQUIRRELFORGE_OBSERVE_RECEIPT_PATH: observation-receipt.json
        run: bin/observe-release.sh

      - name: Restore verified rollback digest after observation failure
        if: steps.observation.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SQUIRRELFORGE_ROLLBACK_IMAGE: ${{ steps.rollout.outputs.rollback_image }}
          SQUIRRELFORGE_ADMISSION_REPOSITORY: ${{ needs.publish.outputs.image_ref }}
          SQUIRRELFORGE_ADMISSION_SOURCE_REPOSITORY: ${{ github.repository }}
          SQUIRRELFORGE_ADMISSION_CERTIFICATE_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/.github/workflows/flock-deployment-gate.yml@refs/tags/v[0-9].*$
          SQUIRRELFORGE_ROLLOUT_NAMESPACE: ${{ vars.SQUIRRELFORGE_ROLLOUT_NAMESPACE }}
          SQUIRRELFORGE_ROLLOUT_STABLE_DEPLOYMENT: ${{ vars.SQUIRRELFORGE_ROLLOUT_STABLE_DEPLOYMENT }}
          SQUIRRELFORGE_ROLLOUT_CONTAINER: ${{ vars.SQUIRRELFORGE_ROLLOUT_CONTAINER }}
          SQUIRRELFORGE_ROLLBACK_RECEIPT_PATH: rollback-receipt.json
        run: bin/rollback-release.sh

      - name: Preserve rollout receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: squirrelforge-production-rollout-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            admission-receipt.json
            rollout-receipt.json
            observation-receipt.json
            rollback-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Reject release after failed observation
        if: steps.observation.outcome == 'failure'
        run: |
          echo "Post-deployment observation failed; rollback was required." >&2
          exit 1

  credential-provider-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build credential-provider image
        run: docker build --file deploy/Dockerfile.credential-provider --tag squirrelforge-credential-provider-ci .

      - name: Provision, start, and smoke-test credential-provider topology
        env:
          SMOKE_API_KEY: ci_credential_smoke_api_key_0123456789abcdef0123456789ab
          PROVIDER_TOKEN: ci_credential_provider_token_0123456789abcdef0123456789
          MFA_MASTER_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          set -eu
          cleanup() {
            docker logs squirrelforge-ci-credential-provider 2>/dev/null || true
            docker rm -f squirrelforge-ci-credential-provider 2>/dev/null || true
            docker network rm squirrelforge-credential-provider-ci-network 2>/dev/null || true
          }
          trap cleanup EXIT

          mkdir -p .ci-credential-provider-runtime
          chmod 0777 .ci-credential-provider-runtime

          docker network create squirrelforge-credential-provider-ci-network

          docker run --rm \
            --entrypoint php \
            --volume "$PWD/.ci-credential-provider-runtime:/app/var" \
            --env SQUIRRELFORGE_ALLOW_SMOKE_PROVISIONING=1 \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_DB=/app/var/credential-provider.sqlite \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_MFA_MASTER_KEY="$MFA_MASTER_KEY" \
            --env SQUIRRELFORGE_SMOKE_IDENTITY_REF=identity_ci_credential_smoke \
            --env SQUIRRELFORGE_SMOKE_MFA_SECRET_PATH=/app/var/mfa-secret \
            squirrelforge-credential-provider-ci \
            /app/bin/provision-smoke-mfa.php

          docker run --detach \
            --name squirrelforge-ci-credential-provider \
            --network squirrelforge-credential-provider-ci-network \
            --volume "$PWD/.ci-credential-provider-runtime:/app/var" \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_TOKEN="$PROVIDER_TOKEN" \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_MFA_MASTER_KEY="$MFA_MASTER_KEY" \
            --env SQUIRRELFORGE_CREDENTIAL_PROVIDER_DB=/app/var/credential-provider.sqlite \
            squirrelforge-credential-provider-ci

          for attempt in $(seq 1 30); do
            if docker run --rm \
              --network squirrelforge-credential-provider-ci-network \
              curlimages/curl:8.10.1 \
              --fail --silent --show-error \
              --header "Authorization: Bearer $PROVIDER_TOKEN" \
              http://squirrelforge-ci-credential-provider:8080/v1/provider/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Credential provider did not become ready." >&2
              exit 1
            fi
            sleep 1
          done

          docker run --rm \
            --entrypoint php \
            --network squirrelforge-credential-provider-ci-network \
            --volume "$PWD/.ci-credential-provider-runtime:/app/var" \
            --env SQUIRRELFORGE_SMOKE_BASE_URL=http://squirrelforge-ci-credential-provider:8080 \
            --env SQUIRRELFORGE_SMOKE_PROVIDER_TOKEN="$PROVIDER_TOKEN" \
            --env SQUIRRELFORGE_SMOKE_IDENTITY_REF=identity_ci_credential_smoke \
            --env SQUIRRELFORGE_SMOKE_API_KEY="$SMOKE_API_KEY" \
            --env SQUIRRELFORGE_SMOKE_MFA_SECRET_PATH=/app/var/mfa-secret \
            squirrelforge-credential-provider-ci \
            /app/bin/credential-provider-smoke-test.php

      - name: Generate CycloneDX SBOM from verified credential-provider image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: squirrelforge-credential-provider-ci
          format: cyclonedx
          output: squirrelforge-credential-provider.cdx.json

      - name: Block critical or high credential-provider image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: squirrelforge-credential-provider-ci
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Preserve exact verified credential-provider image and evidence
        run: |
          docker save squirrelforge-credential-provider-ci | gzip -n > squirrelforge-credential-provider-image.tar.gz
          docker image inspect --format='{{.Id}}' squirrelforge-credential-provider-ci > squirrelforge-credential-provider-image.id
          sha256sum squirrelforge-credential-provider-image.tar.gz > squirrelforge-credential-provider-image.tar.gz.sha256
          sha256sum squirrelforge-credential-provider.cdx.json > squirrelforge-credential-provider.cdx.json.sha256

      - name: Upload verified credential-provider image evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: squirrelforge-credential-provider-verified-image-${{ github.sha }}
          path: |
            squirrelforge-credential-provider-image.tar.gz
            squirrelforge-credential-provider-image.tar.gz.sha256
            squirrelforge-credential-provider-image.id
            squirrelforge-credential-provider.cdx.json
            squirrelforge-credential-provider.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  publish-credential-provider:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: credential-provider-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Download the exact verified credential-provider image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: squirrelforge-credential-provider-verified-image-${{ github.sha }}

      - name: Verify evidence checksums and load image
        run: |
          sha256sum --check squirrelforge-credential-provider-image.tar.gz.sha256
          sha256sum --check squirrelforge-credential-provider.cdx.json.sha256
          gzip --decompress --stdout squirrelforge-credential-provider-image.tar.gz | docker load
          test "$(docker image inspect --format='{{.Id}}' squirrelforge-credential-provider-ci)" = "$(cat squirrelforge-credential-provider-image.id)"

      - name: Authenticate to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push verified credential-provider image and capture immutable digest
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image_ref="ghcr.io/${REPOSITORY,,}/credential-provider"
          docker tag squirrelforge-credential-provider-ci "$image_ref:$RELEASE_TAG"
          docker push "$image_ref:$RELEASE_TAG"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image_ref:$RELEASE_TAG" | cut -d@ -f2)"
          test -n "$digest"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest with GitHub OIDC
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF@$DIGEST"

      - name: Attach build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image_ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attach CycloneDX SBOM attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image_ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: squirrelforge-credential-provider.cdx.json
          push-to-registry: true
