apiVersion: apps/v1
kind: Deployment
metadata:
  name: squirrelforge-credential-provider-canary
  namespace: squirrelforge
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: squirrelforge-credential-provider
      app.kubernetes.io/track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squirrelforge-credential-provider
        app.kubernetes.io/track: canary
    spec:
      containers:
        - name: squirrelforge-credential-provider
          image: ghcr.io/example/squirrelforge/credential-provider@sha256:replace_with_verified_digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Unlike the main image's /v1/health/providers, this health
          # endpoint requires the same Bearer auth as every other route
          # (see CredentialProviderRouter's own doc comment). The header
          # value below is a placeholder -- supply the real probe token
          # through the deployment platform's secret templating, the same
          # "structural guidance only" treatment ROLLOUT.md already
          # documents for this manifest; never commit the real value.
          readinessProbe:
            httpGet:
              path: /v1/provider/health
              port: http
              httpHeaders:
                - name: Authorization
                  value: Bearer replace_with_probe_token_from_secret_store
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: squirrelforge-credential-provider-runtime
          volumeMounts:
            - name: runtime
              mountPath: /app/var
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: squirrelforge-credential-provider-canary-runtime
