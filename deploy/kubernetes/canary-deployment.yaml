apiVersion: apps/v1
kind: Deployment
metadata:
  name: squirrelforge-canary
  namespace: squirrelforge
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: squirrelforge
      app.kubernetes.io/track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squirrelforge
        app.kubernetes.io/track: canary
    spec:
      containers:
        - name: squirrelforge
          image: ghcr.io/example/squirrelforge@sha256:replace_with_verified_digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health/providers
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: squirrelforge-runtime
          volumeMounts:
            - name: runtime
              mountPath: /app/var
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: squirrelforge-canary-runtime
